<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draftosaurus</title>
  <link rel="icon" href="recursos/img/draftosaurus-logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="presentación/CSS/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>

  <header class="py-3">
    <div class="container-fluid d-flex">
      <button class="boton-login me-2">Iniciar sesión</button>
      <button class="boton-registro">Registrarse</button>
    </div>
  </header>

  <main>

    <section class="menu-flotante">
      <ul>
        <li>
          <a href="presentación/HTML/sala.html" class="menu-boton">
            <span>
              <i class="bi bi-controller"></i>
            </span>
            <div class="textoPaginas">
              <p>Sala de juego</p>
            </div>
          </a>
        </li>
        <li>
          <a href="presentación/HTML/estadisticas.html" class="menu-boton">
            <span>
              <i class="bi bi-file-earmark-bar-graph-fill"></i>
            </span>
            <div class="textoPaginas">
              <p>Estadísticas</p>
            </div>
          </a>
        </li>
        <li>
          <a href="presentación/HTML/tutorial.html" class="menu-boton">
            <span>
              <i class="bi bi-journal-text"></i>
            </span>
            <div class="textoPaginas">
              <p>Tutorial</p>
            </div>
          </a>
        </li>
        <li>
          <a href="presentación/HTML/configuracion.html" class="menu-boton">
            <span>
              <i class="bi bi-sliders"></i>
            </span>
            <div class="textoPaginas">
              <p>Configuración</p>
            </div>
          </a>
        </li>
        <li>
          <a href="presentación/HTML/creditos.html" class="menu-boton">
            <span>
              <i class="bi bi-suit-heart-fill"></i>
            </span>
            <div class="textoPaginas">
              <p>Créditos</p>
            </div>
          </a>
        </li>
      </ul>
    </section>

    <section class="titulo-juego">
      <img src="recursos/img/draftosaurus-logo2.png">
    </section>

  </main>

  <footer class="logo-macrohard">
    <img src="recursos/img/LogoMH2.png">
  </footer>

  <article class="formularios" id="formContainer">

    <form class="formulario-login" id="formLogin">
      <label for="usuario">Nombre de usuario</label>
      <input type="text" placeholder="Ingrese su nombre de usuario." required>
      <label for="contrasena">Contraseña</label>
      <input type="password" placeholder="Ingrese su contraseña." required>
      <div class="botones-formulario">
        <button class="botonSalir">Salir</button>
        <button class="botonEntrar">Entrar</button>
      </div>
    </form>

    <form class="formulario-registro" id="formRegistro">
      <label for="usuario">Nombre de usuario</label>
      <input type="text" placeholder="Ingrese su nombre de usuario." required>
      <label for="correo">Correo electrónico</label>
      <input type="email" placeholder="Ingrese su correo electrónico." required>
      <label for="edad">Edad</label>
      <input type="date" placeholder="Ingrese su edad." required>
      <label for="contrasena">Contraseña</label>
      <input type="password" placeholder="Ingrese su contraseña." required>
      <label for="confirmar-contrasena">Confirmar contraseña</label>
      <input type="password" placeholder="Confirme su contraseña." required>
      <div class="botones-formulario">
        <button class="botonSalir">Salir</button>
        <button class="botonEntrar">Registrarse</button>
      </div>
    </form>

  </article>

  <script src="presentación/JS/uiIndex.JS"></script>

</body>

</html>
