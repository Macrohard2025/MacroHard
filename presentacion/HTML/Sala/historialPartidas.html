<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de partidas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="../../../recursos/img/draftosaurus-logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../CSS/estilosGenerales.css">
    <link rel="stylesheet" href="../../CSS/estilosSala.css">
</head>

<body>

    <footer class="logo-macrohard">
        <img id="logo-macrohard" src="../../../recursos/img/LogoMH2.png">
    </footer>

    <main id="historialMostrar" class="historialMostrar container text-center">

        <article class="tituloHistorial">
            <h1 id="textoPrincipal">Historial de partidas</h1>
        </article>

        <section class="table-responsive">
            <table class="table table-striped table-hover align-middle shadow-lg">
                <thead class="table-active text-center">
                    <tr>
                        <th>#</th>
                        <th id="fechaTexto">Fecha</th>
                        <th id="modoTexto">Modo</th>
                        <th id="ganadorTexto">Ganador</th>
                        <th id="puntosTexto">Puntos del ganador</th>
                        <th id="posicionTexto">Tu posición</th>
                    </tr>
                </thead>
                <tbody id="tbody" class="text-center"></tbody>
            </table>
        </section>

        <button class="btn btn-success boton" id="botonVolverHistorial">Volver</button>

    </main>

    <script src="../../JS/uiHistorial.js"></script>
</body>

</html>
