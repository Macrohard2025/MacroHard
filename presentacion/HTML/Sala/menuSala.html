<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de juego</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="../../../recursos/img/draftosaurus-logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../CSS/estilosSala.css">
</head>

<body>

    <header>
        <nav>
            <a href="../../../index.html" class="boton-volver" id="boton-volver">Volver al inicio</a>
        </nav>
    </header>

    <form action="../../../negocio/prePartida.php" id="formComenzarPartida" method="post">

        <input id="inputModoJuego" type="hidden" name="modoJuego">
        <input id="inputTablero" type="hidden" name="tablero">
        <input id="inputNumJugadores" type="hidden" name="numJugadores">
        <input id="inputJugador1" type="hidden" name="jugador1">

    </form>

    <section id="sala">

        <main>
            <button id="botonSolo"> Modo un jugador </button>
            <button id="botonMulti"> Modo multijugador </button>
            <button id="botonHistorial" onclick="window.location.href='historialPartidas.html'"> Historial de partidas </button>
            <button id="botonControl"> Control de partidas </button>
        </main>
        
        <article class="article-partida" id="article-partida">
            <section class="div-partida">
                <p class="pregunta" id="preguntaTablero">¿Qué tablero desea usar?</p>
                <p class="aclarar" id="aclararTablero">(Cada tablero tiene sus propias reglas)</p>
                <div class="botones-tablero">
                    <button id="tablero-invierno" class="boton-invierno">Invierno</button>
                    <button id="tablero-verano" class="boton-verano">Verano</button>
                </div>
                <button id="cancelar" class="cancelar"> Cancelar </button>
            </section>
        </article>

        <article class="article-partida" id="article-partida2">
            <section class="div-partida">
                <p class="pregunta" id="preguntaCantidad">¿Cuántos jugadores habrá?</p>
                <select id="select-jugadores" class="select-jugadores">
                    <option value="" disabled selected id="preguntaOpcion">Elija una opción</option>
                    <option id="optionSelect" style="display: none;" value="1">1 jugador</option>
                    <option value="2" id="jugadorDos">2 jugadores</option>
                    <option value="3" id="jugadorTres">3 jugadores</option>
                    <option value="4" id="jugadorCuatro">4 jugadores</option>
                    <option value="5" id="jugadorCinco">5 jugadores</option>
                </select>
                <button class="boton-listo" id="boton-listo">Listo</button>
                <button id="cancelar" class="cancelar"> Cancelar </button>
            </section>
        </article>
    </section>

    <footer class="logo-macrohard">
        <img id="logo-macrohard" src="../../../recursos/img/LogoMH2.png">
    </footer>

    <script src="../../JS/uiMenuSala.js"></script>

</body>

</html>
