<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  <link rel="icon" href="../../recursos/img/draftosaurus-logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../CSS/estilosGenerales.css">
  <link rel="stylesheet" href="../CSS/estilosConfig.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>

  <header>
    <nav>
      <a href="../../index.html" id="botonVolver" class="btn btn-success boton">Volver al inicio</a>
    </nav>
  </header>

  <section class="container shadow p-3 bg-light">
    <header class="header">
      <h2 id="titulo">Configuración</h2>
      <i class="bi bi-gear"></i>
    </header>
    <article class="profile">
      <section class="profile-card">
        <article class="profile-info">
          <h2 id="nombre-usuario"> Registrarse en inicio </h2>
          <p id="mail-usuario"></p>
        </article>
      </section>
      <button id="botonEditar">Editar Perfil</button>
    </article>
    <article class="settings">
      <section class="modoOscuro">
        <label class="form-check-label" id="textoOsc" for="darkMode">Modo Oscuro</label>
        <input class="form-check-input" type="checkbox" id="darkMode">
      </section>
      <section class="idioma">
        <img src="../../recursos/img/spain.png">
        <button class="btn btn-success boton es" id="es">Español</button>
        <button class="btn btn-success boton en" id="en">English</button>
        <img src="../../recursos/img/uk.png">
      </section>
    </article>
  </section>

  <article class="formularios" id="formContainer">

    <form action="../../negocio/editarUsuario.php" method="post" class="formulario-editar" id="formEditar">
      <label for="usuarioEditar" id="labelUser">Nombre de usuario</label>
      <input type="text" name="usuarioEditar" placeholder="Ingrese su nuevo nombre" id="inputNom" required>
      <label for="correoEditar" id="labelCorreo">Correo electrónico</label>
      <input type="email" name="correoEditar" placeholder="Ingrese su nuevo mail" id="inputMail" required>
      <label for="edadEditar" id="labelEdad">Edad</label>
      <input type="date" min="1900-01-01" max="2018-01-01" name="edadEditar" id="inputEdad" required>
      <label for="contraseniaEditar" id="labelPsw">Contraseña</label>
      <input type="password" name="contraseniaEditar" placeholder="Ingrese su nueva contraseña" id="inputcontrasenia">
      <label for="confirmarcontraseniaEditar" id="labelConfirmarPsw">Confirmar contraseña</label>
      <input type="password" name="confirmarcontraseniaEditar" placeholder="Confirme su nueva contraseña"
        id="inputConfirmarcontrasenia">
      <input type="hidden" name="temaUsuario" id="inputTema">
      <input type="hidden" name="idiomaUsuario" id="inputIdioma">
      <input type="hidden" name="destino" id="inputDestino" value="config">
      <input type="hidden" id="idUsuario" name="idUsuario" value="">
      <div class="botones-formulario">
        <button class="btn btn-success boton botonSalir" id="botonSalir">Salir</button>
        <button class="btn btn-success boton botonConfirm" id="botonConfirmar">Confirmar</button>
      </div>
      <div class="botones-formulario" style="display: none;" id="divCerrarSesion">
        <button class="btn btn-success boton botonCerrar" id="botonCerrar">Cerrar sesión</button>
        <button class="btn btn-success boton botonSalir" id="botonBorrar">Borrar perfil</button>
      </div>
    </form>

  </article>

  <footer class="logo-macrohard">
    <img id="logo-macrohard" src="../../recursos/img/LogoMH2.png">
  </footer>

  <script src="../JS/uiConfiguracion.JS"></script>

</body>

</html>
