<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instalador</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../CSS/estilosGenerales.css">
    <link rel="stylesheet" href="../CSS/estilosInstalador.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="icon" href="../../recursos/img/draftosaurus-logo.png" type="image/png">
</head>

<body>
    <header>
        <h1>Instalador de admin</h1>
        <h3>Ingrese los datos del usuario administrador (No comparta estos datos con nadie que no sea de extrema
            confianza)
        </h3>
    </header>
    <main>
        <form action="../../datos/instalar.php" method="post">
            <label for="usuario">Nombre de usuario</label>
            <input type="text" name="usuario" placeholder="Ingrese su nombre de admin" required>
            <label for="correo">Correo electrónico</label>
            <input type="email" name="correo" placeholder="Ingrese su mail de admin" required>
            <label for="edad">Edad</label>
            <input type="date" min="1900-01-01" max="2018-01-01" name="edad" required>
            <label for="contraseña">Contraseña</label>
            <input type="password" name="contraseña" placeholder="Ingrese su contraseña de admin" id="inputContraseña">
            <label for="confirmarContraseña">Confirmar contraseña</label>
            <input type="password" name="confirmarContraseña" placeholder="Confirme su contraseña de admin"
                id="inputConfirmarContraseña">
            <button class="btn btn-success boton" id="botonEjecutar">Iniciar</button>
        </form>
    </main>

</body>

</html>
