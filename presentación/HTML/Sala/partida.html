<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partida en curso</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../CSS/estilosGenerales.css">
    <link rel="stylesheet" href="../../CSS/estilosPartida.css">
    <link rel="icon" href="../../../recursos/img/draftosaurus-logo.png" type="image/png">
</head>

<body>

    <footer class="logo-macrohard">
        <img src="../../../recursos/img/LogoMH2.png">
    </footer>

    <header>
        <nav>
            <button type="button" class="btn btn-success boton" id="boton-volver">Cancelar partida</button>
            <form id="formCancelarPartida" action="../../../negocio/cancelarPartida.php" method="post">
                <input type="hidden" id="idPartidaInput" name="idPartida">
            </form>
        </nav>
    </header>

    <main class="layout-partida">
        <section class="col-izquierda">
            <section class="grid-dinos">
                <h2>Elige un dinosaurio</h2>
                <div class="dinos">
                    <div>
                        <img src="../../../recursos/img/dinos/plesio.png" alt="Plesiosaurio">
                    </div>
                    <div>
                        <img src="../../../recursos/img/dinos/rex.png" alt="T-Rex">
                    </div>
                    <div>
                        <img src="../../../recursos/img/dinos/trike.png" alt="Trike">
                    </div>
                    <div>
                        <img src="../../../recursos/img/dinos/tera.png" alt="Ptera">
                    </div>
                    <div>
                        <img src="../../../recursos/img/dinos/bronto.png" alt="Bronto">
                    </div>
                    <div>
                        <img src="../../../recursos/img/dinos/stego.png" alt="Estego">
                    </div>
                </div>
            </section>
        </section>

        <section class="col-centro">
            <article id="tablero" class="tablero">
                <div class="rio"></div>

                <div class="recinto recinto-1"></div>
                <div class="recinto recinto-2"></div>
                <div class="recinto recinto-3"></div>
                <div class="recinto recinto-4"></div>
                <div class="recinto recinto-5"></div>
                <div class="recinto recinto-6"></div>
            </article>
        </section>

        <section class="col-derecha">
            <div class="panel-derecho">
                <h3><span class="titulo-verde">Ronda 1</span></h3>
                <p>Turno 1</p>
                <p id="turnoJugador">Turno de <span id="nombreJugador" class="jugador"></span></p>
                <img id="dado" class="dado" src="../../../recursos/img/dado/lado0.png">
            </div>
        </section>
    </main>

    <script src="../../JS/uiPartida.js"></script>
</body>

</html>
