<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  <link rel="icon" href="../../recursos/img/draftosaurus-logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../CSS/estilosGenerales.css">
  <link rel="stylesheet" href="../CSS/estilosConfig.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>

  <header>
    <nav>
      <a href="../../index.html" class="btn btn-success boton">Volver al inicio</a>
    </nav>
  </header>

  <section class="container shadow p-3 bg-light">
    <header class="header">
      <h2>Configuración</h2>
      <i class="bi bi-gear"></i>
    </header>
    <article class="profile">
      <section class="profile-card">
        <article class="profile-info">
          <h2 id="nombre-usuario"> Registrarse en inicio </h2>
          <p id="mail-usuario"></p>
        </article>
      </section>
      <button id="botonEditar">Editar Perfil</button>
    </article>
    <article class="settings">
      <section class="modoOscuro">
        <label class="form-check-label" for="darkMode">Modo Oscuro</label>
        <input class="form-check-input" type="checkbox" id="darkMode">
      </section>
      <section class="idioma">
        <img src="../../recursos/img/spain.png">
        <button class="btn btn-success boton es" id="es">Español</button>
        <button class="btn btn-success boton en" id="en">English</button>
        <img src="../../recursos/img/uk.png">
      </section>
    </article>
  </section>

  <article class="formularios" id="formContainer">

    <form class="formulario-editar" id="formEditar">
      <label for="usuario">Nombre de usuario</label>
      <input type="text" placeholder="Ingrese su nuevo nombre" id="inputNom" required>
      <label for="correo">Correo electrónico</label>
      <input type="email" placeholder="Ingrese su nuevo mail" id="inputMail" required>
      <label for="edad">Edad</label>
      <input type="date" id="inputEdad" required>
      <div class="botones-formulario">
        <button class="btn btn-success boton botonSalir">Salir</button>
        <button class="btn btn-success boton botonConfirm">Confirmar</button>
      </div>
    </form>

  </article>

  <footer class="logo-macrohard">
    <img src="../../recursos/img/LogoMH2.png">
  </footer>

  <script src="../JS/uiConfiguración.JS"></script>

</body>

</html>
