<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <link rel="icon" href="recursos/img/draftosaurus-logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="estilos/estilos.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>
<body>

  <header>
    <nav>
        <button class="boton-login">Iniciar sesión</button>
        <button class="boton-registro ">Registrarse</button>
    </nav>
  </header>
  <main>
    
    <aside class="menu-flotante">
         <a href="sala.html" class="menu-boton">
           <i class="bi bi-controller"></i>
           <span>Sala de juego</span>
        </a>
         <a href="estadisticas.html" class="menu-boton">
          <i class="bi bi-file-earmark-bar-graph-fill"></i>
          <span>Estadísticas</span>
         </a>
         <a href="tutorial.html" class="menu-boton">
         <i class="bi bi-journal-text"></i>
            <span>Tutorial</span>
        </a>
         <a href="configuracion.html" class="menu-boton">
           <i class="bi bi-sliders"></i>
           <span>Configuración</span>
         </a>
        <a href="creditos.html" class="menu-boton">
           <i class="bi bi-suit-heart-fill"></i>
          <span>Créditos</span>
        </a>
    </aside>

    <section  class="titulo-juego">
        <img src="recursos/img/draftosaurus-logo2.png">
    </section>

  </main>

    <footer class="logo-macrohard">
      <img src="recursos/img/LogoMH2.png">
    </footer>

<article class="formularios" id="formContainer">

  <form class="formulario-login" id="formLogin">
    <label for="usuario">Nombre de usuario</label>
    <input type="text" placeholder="Ingrese su nombre de usuario." required>
    <label for="contrasena">Contraseña</label>
    <input type="password" placeholder="Ingrese su contraseña." required>
    <div class="botones-formulario">
    <button class="botonSalir">Salir</button>
    <button class="botonEntrar">Entrar</button>
    </div>
  </form>

  <form class="formulario-registro" id="formRegistro">
    <label for="usuario">Nombre de usuario</label>
    <input type="text" placeholder="Ingrese su nombre de usuario." required>
    <label for="correo">Correo electrónico</label>
    <input type="email" placeholder="Ingrese su correo electrónico." required>
    <label for="edad">Edad</label>
    <input type="number" placeholder="Ingrese su edad." required>
    <label for="contrasena">Contraseña</label>
    <input type="password" placeholder="Ingrese su contraseña." required>
    <label for="confirmar-contrasena">Confirmar contraseña</label>
    <input type="password" placeholder="Confirme su contraseña." required>
    <div class="botones-formulario">
    <button class="botonSalir">Salir</button>
    <button class="botonEntrar">Registrarse</button>
    </div>
  </form>

</article>

<script>
  const formContainer = document.getElementById("formContainer");
  const formLogin = document.getElementById("formLogin");
  const formRegistro = document.getElementById("formRegistro");

  document.querySelector(".boton-login").addEventListener("click", function(e) {
    e.preventDefault();
    formContainer.style.display = "flex";
    formLogin.style.display = "block";
    });

  document.querySelector(".boton-registro").addEventListener("click", function(e) {
    e.preventDefault();
    formContainer.style.display = "flex";
    formRegistro.style.display = "block";
  });
  
  document.querySelectorAll(".botonEntrar").forEach(function(boton) {
        boton.addEventListener("click", function() {
          alert("Funcionalidad de inicio de sesión y registro aún no implementada.");
              formContainer.style.display = "none";
              formRegistro.style.display = "none";
              formLogin.style.display = "none";
        });
      });

      document.querySelectorAll(".botonSalir").forEach(function(boton) {
        boton.addEventListener("click", function() {
          formContainer.style.display = "none";
          formRegistro.style.display = "none";
          formLogin.style.display = "none";
        });
      });

</script>


</body>
</html>
