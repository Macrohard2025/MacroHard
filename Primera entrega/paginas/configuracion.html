<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuración</title>
  <link rel="icon" href="../recursos/img/draftosaurus-logo.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../estilos/estilosConfig.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
</head>

<body>

  <header>
    <nav>
      <a href="../index.html" class="boton-volver">Volver al inicio</a>
    </nav>
  </header>

  <section class="container shadow p-3 bg-light">
    <div class="header">
      <h2>Configuración</h2>
      <i class="bi bi-gear"></i>
    </div>
    <article class="profile">
      <section class="profile-card">
        <i class="bi bi-person-circle"></i>
        <div class="profile-info">
          <h2>Juan Torres</h2>
          <p>juancitogamer@gmail.com</p>
        </div>
      </section>
      <button id="botonEditar">Editar Perfil</button>
    </article>
    <article class="settings">
      <div class="modoOscuro">
        <label class="form-check-label" for="darkMode">Modo Oscuro</label>
        <input class="form-check-input" type="checkbox" id="darkMode">
      </div>
      <div class="idioma">
        <img src="../recursos/img/spain.png">
        <button class="es" id="es">Español</button>
        <button class="en" id="en">English</button>
        <img src="../recursos/img/uk.png">
      </div>
    </article>
  </section>

  <footer class="logo-macrohard">
    <img src="../recursos/img/LogoMH2.png">
  </footer>

  <script>
    const botonEditar = document.getElementById('botonEditar');
    botonEditar.addEventListener('click', function () {
      alert('Funcionalidad de edición de perfil aún no implementada.');
    });

    const checkbox = document.getElementById('darkMode');
    checkbox.addEventListener("change", function () {
      alert('Modo oscuro aún no implementado.');
      checkbox.checked = false;
    });

    const idiomaButtons = document.querySelectorAll('.idioma button');
    idiomaButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        alert(`Funcionalidad de cambio de idioma aún no implementada. Solo se hará el cambio visual.`);
      });
    });

    const esButton = document.getElementById('es');
    const enButton = document.getElementById('en');
    enButton.addEventListener('click', function () {
      esButton.style.color = '#03920f';
      esButton.style.backgroundColor = 'white';
      enButton.style.color = 'white';
      enButton.style.backgroundColor = '#03920f';
    });
    esButton.addEventListener('click', function () {
      enButton.style.color = '#03920f';
      enButton.style.backgroundColor = 'white';
      esButton.style.color = 'white';
      esButton.style.backgroundColor = '#03920f';
    });
  </script>

</body>

</html>
